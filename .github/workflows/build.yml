# Builds the TensorFlow Lite C library for every desktop target and publishes
# them under one tag.
#
# One tag, four artifacts, one TensorFlow version: a downstream lock file pins
# a release, and everything it pins was built from the same sources by the same
# script. Platforms that drifted apart version by version is the thing this
# exists to prevent.
#
# It runs on a tag and nothing else. Editing the build script does not trigger
# it — a change worth publishing is worth tagging — and the tag has to name
# what tflite.toml says, or the run stops. That is a confirmation of what is
# being published, not a second place to say it.
#
# The tag names the TensorFlow version and this repository's own revision,
# `v2.17.1-b1`, because both decide the bytes: the same sources built with
# different flags are a different library, and a checksum in a lock file
# downstream would be the only thing that noticed.
#
# Only the Windows job carries a cache. Its MSVC build is the longest by far,
# its incremental build is sound — up-to-dateness is decided from content
# hashes, not restored timestamps — and a re-tag after a script change would
# otherwise rebuild it for nothing. The rest build fast enough that a cache is
# not worth its failure modes, and this runs a few times a year.
#
# The keys name what decides the bytes: version, script, compiler. A near-miss
# falls back to an older tree for the same TensorFlow version rather than to
# nothing, which is safe for the same reason the cache is: MSBuild rebuilds
# what it finds stale instead of trusting what it was handed. And the saves
# run on failure too, because a cache that is only written when the job
# succeeds keeps nothing from the runs that needed it.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      revision: ${{ steps.v.outputs.revision }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          key() {
            sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"\{0,1\}\([^\"]*\)\"\{0,1\}[[:space:]]*$/\1/p" \
              tflite.toml | head -1
          }
          version=$(key version)
          revision=$(key revision)
          [ -n "$version" ] || { echo "no [tensorflow] version in tflite.toml" >&2; exit 1; }
          [ -n "$revision" ] || { echo "no [tensorflow] revision in tflite.toml" >&2; exit 1; }
          tag="$version-b$revision"

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "the tag is $GITHUB_REF_NAME, but tflite.toml says $tag." >&2
            echo "Tag $tag, or change tflite.toml first." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "revision=$revision"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "building TensorFlow $version at build revision $revision, publishing as $tag"

  build:
    needs: settle
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds both slices and joins them, so one library serves a
          # universal application — which is what a release build is unless it
          # is told otherwise.
          - target: darwin_universal
            runs-on: macos-15
            lib: libtensorflowlite_c.dylib
            ext: tar.gz
          - target: linux_amd64
            runs-on: ubuntu-latest
            lib: libtensorflowlite_c.so
            ext: tar.gz
          - target: linux_arm64
            runs-on: ubuntu-24.04-arm
            lib: libtensorflowlite_c.so
            ext: tar.gz
          - target: windows_amd64
            runs-on: windows-latest
            lib: tensorflowlite_c.dll
            ext: zip
          # The phones are built here rather than taken from Google's own
          # distributions, which move on version lines of their own — the
          # Android AAR and the iOS framework were two different TensorFlow
          # versions from the desktops, against the same weights.
          - target: android_arm64
            runs-on: ubuntu-latest
            lib: libtensorflowlite_c.so
            ext: tar.gz
          - target: android_arm
            runs-on: ubuntu-latest
            lib: libtensorflowlite_c.so
            ext: tar.gz
          - target: android_x64
            runs-on: ubuntu-latest
            lib: libtensorflowlite_c.so
            ext: tar.gz
          - target: ios_device
            runs-on: macos-15
            lib: libtensorflowlite_c.a
            ext: tar.gz
          - target: ios_simulator
            runs-on: macos-15
            lib: libtensorflowlite_c.a
            ext: tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # The compiler is part of the cache key, or a runner image update would
      # silently reuse objects an older MSVC compiled. The key is the
      # compiler's own version, not the toolset's.
      - name: Stamp the compiler (for the cache key)
        if: matrix.target == 'windows_amd64'
        shell: bash
        id: clver
        run: |
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          CL=$(cygpath -u "$("$VSWHERE" -latest -find '**/Hostx64/x64/cl.exe' | head -1 | tr -d '\r')")
          version=$("$CL" 2>&1 | sed -n 's/.*Version \([0-9][0-9.]*\).*/\1/p' | head -1)
          [ -n "$version" ] || { echo "no MSVC version out of $CL" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restore and save are separate steps, and the saves run whatever
      # happened, because actions/cache does not write a cache when the job
      # fails — which is precisely the run whose hours were worth keeping. Four
      # attempts at the Windows export list each rebuilt TensorFlow from
      # nothing, having cached none of the twenty minutes before them.
      - name: Restore the sources
        if: matrix.target == 'windows_amd64'
        uses: actions/cache/restore@v4
        with:
          path: .work/tensorflow
          key: tflite-src-${{ needs.settle.outputs.version }}

      # The key still names everything that decides the objects, so a changed
      # script or compiler is a miss. What is new is the fallback: an older
      # tree for the same TensorFlow version is restored and then brought up to
      # date rather than thrown away. That is only safe because MSBuild decides
      # what is stale from content hashes rather than timestamps, which is the
      # same reason this cache was worth having at all — a restored tree it
      # disagrees with is rebuilt, not reused.
      - name: Restore the build
        if: matrix.target == 'windows_amd64'
        uses: actions/cache/restore@v4
        with:
          path: .work/build-windows_amd64
          key: tflite-build-windows-${{ needs.settle.outputs.version }}-${{ hashFiles('build.sh') }}-cl${{ steps.clver.outputs.version }}
          restore-keys: |
            tflite-build-windows-${{ needs.settle.outputs.version }}-

      - name: Build
        shell: bash
        run: ./build.sh ${{ matrix.target }} "$GITHUB_WORKSPACE/out"

      # `always()`, for the reason above. A save whose key is already there is
      # a warning rather than a failure, and neither is worth a red run.
      - name: Save the sources
        if: always() && matrix.target == 'windows_amd64'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .work/tensorflow
          key: tflite-src-${{ needs.settle.outputs.version }}

      - name: Save the build
        if: always() && matrix.target == 'windows_amd64'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .work/build-windows_amd64
          # The same key as the restore above; workflows have no YAML anchors.
          key: tflite-build-windows-${{ needs.settle.outputs.version }}-${{ hashFiles('build.sh') }}-cl${{ steps.clver.outputs.version }}

      # What was built, by what, from what. A downstream lock file records the
      # checksum; this records everything that decided it.
      - name: Describe it
        shell: bash
        working-directory: out
        run: |
          # Windows carries sha256sum and not shasum; macOS carries shasum and
          # not sha256sum. Taken into a variable rather than written straight
          # into the file, because a command substitution swallows a failure —
          # `sha256=` with nothing after it is what a missing tool looked like
          # here, in a file whose whole job is to say what the bytes are.
          sha() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1
            else shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          sum=$(sha "${{ matrix.lib }}")
          [ -n "$sum" ] || { echo "no checksum for ${{ matrix.lib }}" >&2; exit 1; }
          {
            echo "repository=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "tensorflow=${{ needs.settle.outputs.version }}"
            echo "revision=${{ needs.settle.outputs.revision }}"
            echo "target=${{ matrix.target }}"
            echo "runner=${{ matrix.runs-on }}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256=$sum"
          } > ${{ matrix.target }}.build
          cat ${{ matrix.target }}.build

      # PowerShell, because it is the one tool on this runner that makes a
      # zip. This used to be `tar -a -c -f $NAME.zip`, counting on the bsdtar
      # Windows ships as tar.exe — but `shell: bash` is msys bash, whose tar
      # is GNU tar, whose -a picks a *compressor* from the extension and knows
      # no zip format at all. It wrote a plain tar and named it .zip, and
      # nothing here failed: v2.17.1-b3's Windows archive is that tar, and it
      # was the downstream unpacker that found out.
      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        working-directory: out
        run: |
          $name = "tflite_c_${{ needs.settle.outputs.tag }}_${{ matrix.target }}"
          Compress-Archive -Path '${{ matrix.lib }}', 'tensorflowlite_c.lib', `
                                 '${{ matrix.target }}.build' `
                           -DestinationPath "$name.zip"
          $sum = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$sum  $name.zip"

      - name: Archive (tar.gz)
        if: matrix.ext != 'zip'
        shell: bash
        working-directory: out
        env:
          NAME: tflite_c_${{ needs.settle.outputs.tag }}_${{ matrix.target }}
        run: |
          tar czf "$NAME.tar.gz" "${{ matrix.lib }}" "${{ matrix.target }}.build"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$NAME.tar.gz"
          else shasum -a 256 "$NAME.tar.gz"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/tflite_c_*

  publish:
    needs: [settle, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }

      # The checksums a downstream lock file needs, in one place, so nobody has
      # to download four archives to write them down.
      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 tflite_c_* | tee SHA256SUMS
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.settle.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "TensorFlow Lite C, $TAG" \
              --notes "The TensorFlow Lite C library with the XNNPACK delegate, built from TensorFlow ${{ needs.settle.outputs.version }} by this repository's build.sh.

          Nothing is patched: the sources are cloned at that tag and compiled with upstream's own CMake build.

          macOS carries both architectures in one library, so a universal application links one file. Each archive holds a \`.build\` file naming the version, the commit and runner that produced it, and the checksum; \`SHA256SUMS\` has all four.

          The tag names the TensorFlow version and this repository's build revision, because the same sources built with different flags are a different library." 
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" artifacts/* --clobber
